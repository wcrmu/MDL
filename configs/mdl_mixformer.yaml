# MDL-MixFormer over the current coarse search/recommendation scenes and three
# production tasks. Scenario-conditioned query routing is explicitly marked as
# an experimental composition.
extends: mdl_onetrans.yaml

runtime:
  activation_checkpoint: full
  sequence_projection_chunk_tokens: 1024

data:
  train:
    reader:
      device_prefetch_batches: 0
      host_prepare_prefetch: 2
      length_buckets:
        # Keep short-bucket throughput near paper while leaving HBM headroom for
        # high-padding batches under full activation checkpoint.
        - {max_length: 2048, batch_size: 768}
        - {max_length: 4096, batch_size: 384}
        - {max_length: 6144, batch_size: 256}
        - {max_length: 8192, batch_size: 160}
        - {max_length: null, batch_size: 192}

tokenization:
  feature_tokenizer: rankmixer
  feature_tokens: []
  num_feature_tokens: 16

model:
  name: mdl_mixformer
  ns_tokenizer: auto_split
  token_dim: 384
  num_layers: 4
  num_heads: 12
  hidden_dim: 1024
  task_head_hidden_dim: 1024
  sequence_fusion: timestamp_aware
  use_sep_tokens: false
  use_pyramid: false
  final_s_tokens: null
  first_domain_sequence_layer: null
  mixformer_user_head_count: null
  mdl_mixformer_query_conditioning: true
  experimental_model_acknowledged: true

training:
  step_watchdog_sec: 600.0
  batch_size: 768
  lr_dense: 0.01
  dense_optimizer: rmsprop
  task_loss_weights:
    fst_cart: 0.5
    cateid_filter: 0.01
    upid_pay: 0.01
  log_every_steps: 100
