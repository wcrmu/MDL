# UniFormer on the current coarse search/recommendation feature contract.
# Extends the MixFormer pack: same fields, same eight raw behavior streams,
# same three labels. FIM depth is num_layers; TIM depth is uniformer_tim_layers.
# Dense-only compile is available but stays off pending target-GPU measurement.
extends: mixformer.yaml
training:
  checkpoint:
    run_name: uniformer_v2
tokenization:
  # Whole-field semantic tokens: four request groups and four candidate groups.
  ns_tokens:
    - name: user_context
      inputs: [currency_hn, hash_language_hn, hash_language_site_hn, language_hn, page_elsn_hn, page_sn_hn, plat_hn, region_hn, site_id_hn, timezone_hn]
    - name: user_query_recall
      inputs: [ups_query_term_hash_v2_hn, ups_query_tg_hn, site_q2i_good_list_hn_share, query_tfidf_term_hash_list_hn, origin_query_hash_hn, query_arr_hn, query_hash_hn, query_terms_hash_hn, recall_merge_cate1_ids_hn, recall_merge_cate_ids_hn, recall_merge_cate_levels_hn, search_method_hn, opt_id_hn, ups_search_method_hash_hn]
    - name: user_browsing
      inputs: [flip_mall_ids_hn, list_clk_cat1_ids_hn, offline_outside_goods_id_list_hn_share, view_7d_page_elsns_hn, view_7d_page_sns_hn, clk_7d_page_elsns_hn, impr_3h_tg_hn, impr_all_tg_hn]
    - name: user_transactions
      inputs: [ups_in_cart_goods_hn_share, ups_in_cart_tg_hn, u_fst_ordr_cnt_mix_d_hn, ups_incart_cat1_id_nc_hn, ups_in_cart_2h_sku_cur_prices_hn, buy_long_spec_vids_hn, cart_long_spec_vids_hn]
    - name: item_identity_content
      inputs: [create_time_hn, goods_title_tfidf_term_hash_list_hn, cat_id_hn, cat1_id_hn, cat2_id_hn, cat3_id_hn, cat4_id_hn, mall_id_hn, sellr_type_hn, goods_id_hn, goods_ner_infos_hn, g_prpty_val_id_list_hn, goods_name_bigram_hn]
    - name: item_commerce
      inputs: [adj_cartcvr_hn, adj_ctr_hn, adj_cvr_hn, price_bef_coupon_hn, sales_hn, mkt_prc_hn, cart_cnt_1d_hn, cart_cnt_3d_hn, clk_cnt_1d_hn, scene_adj_cartcvr_15d_hn, scene_adj_ctr_15d_hn, scene_adj_cvr_15d_hn, goods_scene_clk_cnt_15d_hn, scene_cart_cnt_15d_hn, nfk_gmv_14d_hn, nfk_sales_14d_hn, nfk_price_14d_hn, impr_clk_6h_cnt_hn, show_price_hn, price_after_promotion_hn, promotion_discount_hn]
    - name: item_matching
      inputs: [i2i_list_amazoni2ifullgmv_hn_share, i2i_list_multimodal_hn_share, i2i_list_swingv3gmv_hn_share, i2i2cat2_swing_hn, i2i_coclk_hn_share, rel_score_hn, f_goods_view_times_tg_l1_hn, cart_hit_i2i_idx_hn, us_ctr_price_dis50_hn, multimodal_i2i_hit_cart_size_hn, auto_price_p10_dis_hn, cart_long_hit_samestyle_i2i_idx_hn, clk_hit_i2i_idx_hn, site_x_asian_code_hn, q_hit_good_correct_unigram_hn, tit_in_top_query_cnt_hn, i2i_hit_site_q2i_idx_hn, rev_ratings_cnt_crs_pos_hn, mid_goods_prc_list_dis, mid_cmprc_diff_list_dis, impr_cat_clk_goods_ids_cnt_1d_hn, multimodal_i2i_hit_clk_size_hn, ups_clkv2_i2i_goods_ids_hit_size, impr_long_goods_abs_timegap_1d_hn, clk_long_goods_abs_timegap_1d_hn, ups_clkv2_i2i_goods_ids_hit_all_size]
    - name: item_sku_creative
      inputs: [g_sku_spec_hash_hn, g_sku_spec_unit_list_hn, g_sku_spec_hn, sku_id_hn, sku_price_dis_hn, sku_sales_dis_hn, sku_cart_cnt_7d_hn, sku_ordr_cnt_1m_hn, goods_avlb_sku_num_dis_hn, goods_onsale_sku_num_dis_hn, sku_spec_hn, sku_spec_vids_hn, idx_goods_creative_id_hn, idx_c_impr_cnt_15d_hn, idx_c_clk_cnt_15d_hn, idx_c_cart_cnt_15d_hn, idx_c_ordr_cnt_15d_hn, idx_c_adj_ctr_15d_hn, idx_c_adj_cart_cvr_15d_hn]
runtime:
  compile: false
model:
  name: uniformer
  num_layers: 2
  uniformer_tim_layers: 1
