# Fine-grained scene-discovery sibling of configs/mdl_mixformer.yaml.
extends: mdl_onetrans_fine.yaml

runtime:
  activation_checkpoint: full
  sequence_projection_chunk_tokens: 8192

data:
  train:
    reader:
      device_prefetch_batches: 0
      host_prepare_prefetch: 2
      length_buckets:
        # Match OneTrans H100-80G budget after mid-run OOM at 768.
        - {max_length: 2048, batch_size: 512}
        - {max_length: 4096, batch_size: 256}
        - {max_length: 6144, batch_size: 160}
        - {max_length: 8192, batch_size: 96}
        - {max_length: null, batch_size: 128}

tokenization:
  feature_tokenizer: rankmixer
  feature_tokens: []
  num_feature_tokens: 16

model:
  name: mdl_mixformer
  ns_tokenizer: auto_split
  token_dim: 384
  num_layers: 4
  num_heads: 12
  hidden_dim: 1024
  task_head_hidden_dim: 1024
  sequence_fusion: timestamp_aware
  use_sep_tokens: false
  use_pyramid: false
  final_s_tokens: null
  first_domain_sequence_layer: null
  mixformer_user_head_count: null
  mdl_mixformer_query_conditioning: true
  experimental_model_acknowledged: true

training:
  step_watchdog_sec: 600.0
  batch_size: 512
  lr_dense: 0.0001
  dense_optimizer: rmsprop
  task_loss_weights:
    fst_cart: 0.5
    cateid_filter: 0.01
    upid_pay: 0.01
  log_every_steps: 100
  checkpoint:
    # Overrides the run_name inherited from mdl_onetrans_fine.yaml; a resume
    # must never cross two models' checkpoint directories.
    run_name: mdl_mixformer_fine
