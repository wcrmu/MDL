# Paper-aligned MixFormer over the current coarse-scene industrial data contract.
# N=16, L=4, D=384 follows the internally consistent MixFormer-small setting
# (the manuscript prints D=386 although HeadMixing requires D divisible by N).
extends: onetrans.yaml

runtime:
  activation_checkpoint: full
  # Tighter than OneTrans: MixFormer sequence FFN is N*D wide and cross-attn
  # score tensors scale with L; also enables length/request attention chunking.
  sequence_projection_chunk_tokens: 2048

data:
  train:
    adapter:
      options:
        # Merge the nine UPS histories before truncation. 2048 equals the old
        # sum of per-stream caps, so memory capacity stays constant while an
        # active stream can borrow unused capacity from sparse/empty streams.
        global_sequence_max_length: 2048
    reader:
      # Parent OneTrans keeps one device-side batch; at MixFormer batch≥1024
      # that doubles peak HBM. Host queue alone is enough to hide prepare.
      device_prefetch_batches: 0
      host_prepare_prefetch: 2
      length_buckets:
        # Paper MixFormer uses batch≈1500; keep ≥1024 on the short bucket and
        # scale longer buckets more aggressively than RankMixer/OneTrans for HBM.
        - {max_length: 2048, batch_size: 1024}
        - {max_length: 4096, batch_size: 512}
        - {max_length: 6144, batch_size: 320}
        - {max_length: 8192, batch_size: 192}
        - {max_length: null, batch_size: 256}
  test:
    adapter:
      options:
        global_sequence_max_length: 2048

tokenization:
  feature_tokenizer: rankmixer
  feature_tokens: []
  num_feature_tokens: 16

model:
  name: mixformer
  # The parent OneTrans profile may use its model-specific DCNv2 tokenizer;
  # MixFormer consumes feature heads directly and must retain the neutral mode.
  ns_tokenizer: auto_split
  token_dim: 384
  num_layers: 4
  num_heads: 12
  # The paper does not disclose the SwiGLU intermediate width. 1024 gives a
  # dense-parameter budget close to MixFormer-small and is feasible on 2xH100.
  hidden_dim: 1024
  task_head_hidden_dim: 1024
  # The nine physical histories share a request-relative time delta derived
  # from the same impr_time. Globally interleave actions by that monotonic
  # clock and encode their stream as action type; the paper has no SEP events.
  sequence_fusion: timestamp_aware
  global_sequence_max_length: 2048
  use_sep_tokens: false
  mixformer_user_head_count: null
  use_pyramid: false
  final_s_tokens: null

training:
  step_watchdog_sec: 600.0
  batch_size: 1024
  lr_dense: 0.01
  dense_optimizer: rmsprop
  task_loss_weights:
    fst_cart: 0.5
    cateid_filter: 0.01
    upid_pay: 0.01
  log_every_steps: 100
