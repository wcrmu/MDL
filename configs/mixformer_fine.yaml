# Fine-grained scene-discovery sibling of configs/mixformer.yaml.
extends: onetrans_fine.yaml

runtime:
  activation_checkpoint: full
  sequence_projection_chunk_tokens: 2048

data:
  train:
    adapter:
      options:
        global_sequence_max_length: 2048
    reader:
      device_prefetch_batches: 0
      host_prepare_prefetch: 2
      length_buckets:
        - {max_length: 2048, batch_size: 1024}
        - {max_length: 4096, batch_size: 512}
        - {max_length: 6144, batch_size: 320}
        - {max_length: 8192, batch_size: 192}
        - {max_length: null, batch_size: 256}
  test:
    adapter:
      options:
        global_sequence_max_length: 2048

tokenization:
  feature_tokenizer: rankmixer
  feature_tokens: []
  num_feature_tokens: 16

model:
  name: mixformer
  ns_tokenizer: auto_split
  token_dim: 384
  num_layers: 4
  num_heads: 12
  hidden_dim: 1024
  task_head_hidden_dim: 1024
  sequence_fusion: timestamp_aware
  global_sequence_max_length: 2048
  use_sep_tokens: false
  mixformer_user_head_count: null
  use_pyramid: false
  final_s_tokens: null

training:
  step_watchdog_sec: 600.0
  batch_size: 1024
  lr_dense: 0.01
  dense_optimizer: rmsprop
  task_loss_weights:
    fst_cart: 0.5
    cateid_filter: 0.01
    upid_pay: 0.01
  log_every_steps: 100
